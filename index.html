<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0b09">
<title>小妖九死一生</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d0b09;color:#eadfc6;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;background:radial-gradient(120% 60% at 50% 0%,#2a1d10 0%,#120e0a 60%,#0d0b09 100%);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.btn{display:block;width:100%;min-height:54px;padding:12px 16px;border-radius:12px;background:linear-gradient(#3c2c19,#281d11);border:1px solid #6e5532;font-size:17px;color:#f4e5c2;text-align:left;line-height:1.35;box-shadow:0 2px 0 #000a}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.main{background:linear-gradient(#e0a43a,#94601a);color:#1b1006;font-weight:800;text-align:center;font-size:20px;border-color:#ffd77a;letter-spacing:2px}
.btn.red{background:linear-gradient(#8c2a1e,#5a160e);border-color:#d0573f;color:#ffe6d6;text-align:center;font-weight:700}
.btn.ghost{background:transparent;border-color:#4a3a24;color:#c9b48a;text-align:center;min-height:46px;font-size:15px}
.btn.ad{background:linear-gradient(#2f7a3e,#1b4a24);border-color:#7fd28f;color:#eaffea;text-align:center;font-weight:800}
.btn[disabled]{opacity:.38;filter:grayscale(.7)}
.btn .tag{display:block;font-size:13px;color:#c8b183;margin-top:3px;font-weight:400;letter-spacing:0}
.btn.main .tag{color:#3b2508}
.row{display:flex;gap:8px}
.row>*{flex:1}
.r0{color:#d9d2c0}.r1{color:#7fd98a}.r2{color:#6fb4ff}.r3{color:#c79bff}.r4{color:#ffcf4a;text-shadow:0 0 8px #ffb30080}
/* home */
#home{overflow-y:auto;padding:18px 16px 40px}
#home>*,#death>*,#birth>*{flex-shrink:0}
.logo{text-align:center;margin:14px 0 4px;font-size:42px;font-weight:900;letter-spacing:6px;background:linear-gradient(#ffe9a8,#d3902a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #c9822a40}
.sub{text-align:center;color:#a8946c;font-size:14px;margin-bottom:18px;letter-spacing:2px}
.panel{background:#1b140c;border:1px solid #3e2f1c;border-radius:14px;padding:14px;margin:14px 0}
.panel h4{font-size:16px;color:#f2c14e;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.panel h4 small{color:#a8946c;font-weight:400;font-size:12.5px}
.soul{font-size:15px;color:#c9b6ff}
.up{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed #33271a}
.up:first-of-type{border-top:none}
.up .t{flex:1;font-size:15px}
.up .t small{display:block;color:#9d8a66;font-size:12.5px;margin-top:2px}
.up button{min-width:84px;min-height:42px;border-radius:10px;background:#3a2a5a;border:1px solid #8a6fd0;color:#e7dcff;font-size:14px}
.up button[disabled]{opacity:.35}
.bl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bl button{min-height:58px;border-radius:10px;border:1px solid #4a3a24;background:#22190f;font-size:15px;padding:6px 4px;line-height:1.25}
.bl button small{display:block;font-size:11px;color:#9d8a66}
.bl button.sel{border-color:#ffd77a;background:#3b2a12;box-shadow:0 0 0 2px #ffd77a50 inset}
.bl button.lock{opacity:.45}
.ends{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.ends div{border:1px solid #3e2f1c;border-radius:8px;padding:8px 2px;font-size:13px;color:#6b5a3e;min-height:50px;display:flex;align-items:center;justify-content:center}
.ends div.on{color:#ffd77a;border-color:#a57a2a;background:#2a1e0c}
.rumor{font-size:13.5px;color:#bfa978;line-height:1.7}
.pbar{height:8px;background:#2a2016;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a17,#ffd77a)}
.hist{font-size:13px;color:#a8946c;line-height:1.8}
.inv{font-size:14px;line-height:1.7;color:#d8c8a3}
.demo{display:inline-block;font-size:11px;background:#5a3a12;color:#ffd77a;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
/* birth */
#birth{padding:16px;overflow-y:auto}
#birth h2{text-align:center;font-size:24px;color:#ffd77a;margin:8px 0 12px;letter-spacing:4px}
.bcard{background:#1b140c;border:1px solid #4a3a24;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bcard .k{font-size:12.5px;color:#9d8a66}
.bcard .v{font-size:19px;font-weight:700;margin-top:2px}
.nmrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.nmrow .nmbl{flex:none;font-size:17px;font-weight:700;white-space:nowrap;color:#e8d5a8}
#bName{flex:1;min-width:0;font-size:18px;font-weight:700;color:#ffd77a;background:#120d07;border:1px solid #7a5f36;border-radius:10px;padding:9px 10px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
#bName:focus{border-color:#ffd77a;box-shadow:0 0 0 2px rgba(255,215,122,.25)}
#bName.pop{animation:nmpop .35s}
@keyframes nmpop{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
#bDice{flex:none;width:46px;height:44px;font-size:22px;border-radius:10px;border:1px solid #7a5f36;background:#2a1f12;color:#fff}
#bDice:active{transform:rotate(90deg) scale(.9)}
.lastnm{margin-top:6px;background:none;border:none;color:#c9a35a;font-size:13px;padding:2px 0;text-decoration:underline;font-family:inherit}
.bcard .d{font-size:13px;color:#b9a47a;margin-top:2px}
.stpick{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.stopt{display:block;width:100%;text-align:left;border:1px solid #4a3a24;border-radius:12px;padding:10px 12px;background:#140f0a;color:#eadfc6}
.stopt.on{border-color:#6fd29a;background:#1a2a20;box-shadow:0 0 0 1px #6fd29a}
.stopt b{font-size:17px;font-weight:800}
.stopt .newbie{display:inline-block;margin-left:8px;font-style:normal;font-size:12px;font-weight:800;color:#1b1006;background:#ffd77a;border-radius:6px;padding:1px 6px;vertical-align:1px}
.stopt small{display:block;color:#c9b183;font-size:13px;line-height:1.55;margin-top:4px;font-weight:400}
.tal{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.tal div{border-radius:10px;padding:8px 10px;background:#140f09;border:1px solid #3a2d1c;font-size:16px}
.tal div small{display:block;font-size:12.5px;color:#a8946c;font-weight:400}
.tal div.t3{border-color:#8f62e0;box-shadow:0 0 12px #8f62e055}
.tal div.t4{border-color:#ffcf4a;box-shadow:0 0 16px #ffb30088;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px #ffb30066}to{box-shadow:0 0 22px #ffb300cc}}
.alloc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.alloc div{display:flex;align-items:center;background:#140f09;border:1px solid #3a2d1c;border-radius:10px;padding:4px 4px 4px 10px}
.alloc span{flex:1;font-size:15px;white-space:nowrap;min-width:0}
.alloc b{color:#ffd77a;min-width:32px;text-align:center;font-size:17px;flex:none;letter-spacing:-.5px}
.alloc button{flex:none;width:38px;height:40px;border-radius:8px;background:#2e2214;border:1px solid #5a4528;font-size:22px;color:#ffd77a}
.spin{animation:spin .08s linear infinite}
@keyframes spin{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}

/* v4 战斗力 */
#hCP{flex:none;text-align:right;padding:4px 10px 4px 12px;border-radius:12px;background:linear-gradient(135deg,#3a2408,#1c1206);border:1px solid #7a5a22;box-shadow:0 0 12px #f2c14e22 inset;line-height:1.05}
#hCP small{display:block;font-size:11px;color:#c9a35a;letter-spacing:3px}
#cpN{font-size:25px;font-weight:900;color:#ffd77a;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #ffb30066;display:inline-block}
#hCP.g #cpN{animation:cpg .7s}#hCP.r #cpN{animation:cpr .7s}
@keyframes cpg{30%{transform:scale(1.18);color:#fff3b0;text-shadow:0 0 16px #ffd000}}
@keyframes cpr{30%{transform:scale(.9);color:#ff8a6a}}
#pops{position:fixed;inset:0;pointer-events:none;z-index:72;overflow:hidden}
.pp{position:absolute;transform:translate(-50%,0);font-weight:900;font-size:14px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 6px #000;animation:ppup 1.3s ease-out forwards}
.pp.up{color:#9ff0a8}.pp.dn{color:#ff7a5a}.pp.xp{color:#ffe08a;font-size:13px}
.pp.cp{font-size:17px;color:#ffd77a}.pp.cp.dn{color:#ff7a5a}.pp.big{font-size:22px}
@keyframes ppup{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
#cpbig{position:fixed;inset:0;z-index:76;pointer-events:none;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,#000c 0,#0008 45%,#0000 75%)}
#cpbig.on{display:flex;animation:cbo 2.9s ease forwards}
#cpbig .cbt{font-size:30px;font-weight:900;color:#fff3cc;letter-spacing:8px;text-shadow:0 0 18px #ffb300;animation:popin .5s cubic-bezier(.2,1.6,.4,1) both}
#cpbig .cbl{margin-top:14px;font-size:15px;color:#e8c878;letter-spacing:8px}
#cpbig .cbn{font-size:56px;font-weight:900;color:#ffd77a;font-variant-numeric:tabular-nums;text-shadow:0 0 24px #ffb300,0 2px 0 #7a4f14;animation:cbn 1.8s cubic-bezier(.2,1.4,.4,1) both}
#cpbig .cbd{margin-top:6px;font-size:20px;font-weight:800;color:#9ff0a8;text-shadow:0 0 10px #000;animation:popin .5s 1.2s both}
@keyframes cbn{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1)}75%{transform:scale(1.22)}100%{transform:scale(1.1)}}
@keyframes cbo{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
/* 遭遇卡 */
.sheet.enc .chs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet.enc .chs .btn{min-height:50px;font-size:15.5px;padding:8px 8px;text-align:center}
.sheet.enc .chs .btn:first-child{grid-column:1/3}
.sheet.enc .chs .btn .tag{font-size:11.5px}
.sheet.enc.strong{box-shadow:0 0 0 2px #c0302a,0 0 30px #ff2a1a55}
.sheet.enc.strong .kick{color:#ff6a4a;animation:blink .9s infinite}
.encc{display:flex;align-items:stretch;gap:6px;margin:6px 0 8px}
.encc .es{flex:1;min-width:0;text-align:center;padding:10px 4px 8px;border-radius:12px;background:#1d150d;border:1px solid #3a2c1a}
.encc .es.en.r{border-color:#c0302a;background:linear-gradient(#3a120c,#1d0f0a);box-shadow:0 0 14px #ff2a1a44}
.encc .es.en.y{border-color:#b8902a;background:linear-gradient(#33280c,#1d160a)}
.encc .es.en.g{border-color:#3a8a4a;background:linear-gradient(#10301a,#0d1a10)}
.epo{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:radial-gradient(circle at 50% 40%,var(--ec,#5a4020),#120c06 75%);border:2px solid #ffffff22}
.encc .enm{font-size:14px;font-weight:800;color:#ffe2a0;line-height:1.3;word-break:break-all}
.encc .esb{font-size:11.5px;color:#a8946c;margin-top:2px}
.encc .ecp{margin-top:5px;font-size:17px;font-weight:900;color:#ffd77a;font-variant-numeric:tabular-nums}
.encc .en.r .ecp{color:#ff6a4a}.encc .en.g .ecp{color:#7fd98a}.encc .en.y .ecp{color:#ffd24a}
.encc .evs{align-self:center;font-size:20px;font-weight:900;color:#ff8a4a;font-style:italic;text-shadow:0 0 8px #f40}
.ehint{text-align:center;font-size:13px;color:#cbb88f;padding:6px 8px;border-radius:8px;background:#0006;margin-bottom:6px}
.ehint b{font-size:16px;margin-right:2px}.ehint.r b{color:#ff5a3a}.ehint.y b{color:#ffd24a}.ehint.g b{color:#7fd98a}
.esay{font-size:14.5px;line-height:1.7;color:#eadbb8;margin:4px 2px 10px;font-style:italic}
/* 交锋 */
#cine.clash{background:radial-gradient(circle at 50% 45%,#2a1408,#000 80%)}
#cine .cw{display:flex;align-items:center;gap:8px;width:100%;max-width:400px;z-index:2}
#cine .cs{flex:1;min-width:0;position:relative}
#cine .cs .epo{width:84px;height:84px;font-size:48px}
#cine .cs .enm{font-size:14px;font-weight:800;color:#ffe2a0;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cine .hp{height:10px;border-radius:5px;background:#3a1a12;overflow:hidden;border:1px solid #0008}
#cine .hp i{display:block;height:100%;background:linear-gradient(90deg,#c0302a,#ff8a4a);transition:width .25s}
#cine .cs.me .hp i{background:linear-gradient(90deg,#2c8a3a,#9ff0a8)}
#cine .cs .ecp{margin-top:5px;font-size:15px;font-weight:900;color:#ffd77a}
#cine .cvs{font-size:34px;animation:blink .3s infinite}
#cine .dmg{position:absolute;left:0;right:0;top:20px;height:0}
#cine .dmg b{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:22px;font-weight:900;color:#ff4a2a;text-shadow:0 0 6px #000,0 2px 0 #000;animation:dmg .8s ease-out forwards;white-space:nowrap}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
#cine .cs.hit .epo{animation:hit .28s}
@keyframes hit{0%,100%{transform:none;filter:none}30%{transform:translateX(6px) rotate(6deg);filter:brightness(2.2) saturate(0)}60%{transform:translateX(-5px)}}
#cine .cs.me.lunge .epo{animation:lgR .26s}#cine .cs.en.lunge .epo{animation:lgL .26s}
@keyframes lgR{50%{transform:translateX(34px) scale(1.12)}}@keyframes lgL{50%{transform:translateX(-34px) scale(1.12)}}
#cine .cres{margin-top:26px;font-size:64px;font-weight:900;height:80px;z-index:2}
#cine .cres.w{color:#ffd77a;text-shadow:0 0 24px #ffb300;animation:popin .45s cubic-bezier(.2,1.6,.4,1) both}
#cine .cres.l{color:#ff3a1a;text-shadow:0 0 24px #f00;animation:popin .45s both}
/* v5 画面 */
#stage{position:relative;height:118px;overflow:hidden;border-bottom:1px solid #3a2c1a;flex:none}
#stage .scene{position:absolute;inset:0;width:100%;height:100%}
#stage .sfig{position:absolute;left:6px;bottom:0;filter:drop-shadow(0 4px 6px #0008)}
#stage .sfig svg{height:114px;width:auto}
#stage .sinfo{position:absolute;left:122px;right:10px;bottom:12px;text-shadow:0 1px 3px #000,0 0 8px #000}
#stage .sinfo b{display:block;font-size:20px;letter-spacing:3px;color:#ffe2a0}
#stage .sinfo small{display:block;font-size:12.5px;color:#e8d6ac;margin-top:2px}
#stage .sinfo i{display:block;width:64px;height:3px;border-radius:2px;margin-top:6px;box-shadow:0 0 8px currentColor}
svg .pulse{animation:svp 1.6s ease-in-out infinite alternate}
@keyframes svp{from{opacity:.55}to{opacity:1}}
svg .spin{transform-box:fill-box;transform-origin:center;animation:rot 16s linear infinite}
svg .sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
svg .bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
svg .ptc circle{animation:ptc 3s linear infinite}
svg .ptc circle:nth-child(2n){animation-duration:4.2s;animation-delay:-1.3s}svg .ptc circle:nth-child(3n){animation-duration:3.6s;animation-delay:-2.2s}
@keyframes ptc{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
svg .wisp{animation:svp 1.2s ease-in-out infinite alternate}
svg .wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-12px)}}
svg .march{animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.fbart .twk{animation:svp .7s infinite alternate}
.fbart.st3{filter:drop-shadow(0 0 4px var(--rc,#fc6))}
.scn{margin:-18px -16px 10px;border-radius:18px 18px 0 0;overflow:hidden;height:64px;opacity:.95}
.scn svg{display:block}
.zmap{display:block;margin:4px 0 10px;border-radius:10px;box-shadow:0 0 0 1px #a57a2a}
.zhint{font-size:11.5px;color:#c99a7a;margin-top:4px;text-align:right}
.rvp{display:flex;justify-content:space-around;margin:4px 0 8px}
.rvp small{display:block;font-size:11px;color:#ffd77a}
/* 法宝囊 */
.bagtop{text-align:center;padding:6px 0 10px;margin-bottom:6px;border-bottom:1px dashed #4a3a24;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 65%)}
.bagart{display:flex;justify-content:center;animation:bob 2.6s ease-in-out infinite alternate}
.bagnm{font-size:20px;font-weight:900;margin-top:4px;text-shadow:0 0 10px currentColor}
.bagsub{font-size:12px;color:#b9a47a;margin-top:2px}
.bagst{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.bst{flex:1;padding:4px 0;border-radius:8px;border:1px solid #3a2c1a;opacity:.45;filter:grayscale(.6)}
.bst.past{opacity:.75;filter:none}
.bst.on{opacity:1;filter:none;border-color:var(--rc);box-shadow:0 0 10px var(--rc)}
.bst svg{display:block;margin:0 auto}.bst small{font-size:10.5px;color:#d8c49a}
#modal .fbcard:not(.empty){cursor:pointer}
/* 交锋 v5 */
#cine.clash{background:#000}
#cine .scene.full{position:absolute;left:0;right:0;bottom:0;top:auto;width:100%;height:52%;opacity:.9;z-index:0;-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
#cine.clash,#cine.act{background:radial-gradient(circle at 50% 40%,#2a1c10,#050302 75%)}
#cine.clash .dmg{top:130px}
#cine .arena svg.fig{width:150px;height:auto}
#cine .cwrap{position:relative;z-index:2;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
#cine .cs .fg{position:relative;margin-top:8px;height:150px;display:flex;align-items:flex-end;justify-content:center}
#cine .cs .fg svg.fig{width:128px;height:auto;filter:drop-shadow(0 6px 8px #000a)}
#cine .cs.en .fg svg.fig{transform:scaleX(-1)}
#cine .cs.hit .fg{animation:hit .28s}
#cine .cs.me.lunge .fg{animation:lgR .26s}#cine .cs.en.lunge .fg{animation:lgL .26s}
#cine .cs.ko .fg{animation:ko .6s forwards}
@keyframes ko{to{transform:rotate(80deg) translateY(30px);opacity:.35;filter:grayscale(1)}}
#cine .cs.me.ko .fg{animation-name:kor}@keyframes kor{to{transform:rotate(-80deg) translateY(30px);opacity:.35;filter:grayscale(1)}}
#cine .slash{position:absolute;left:50%;top:50%;width:150px;height:8px;margin:-4px 0 0 -75px;border-radius:50%;background:linear-gradient(90deg,transparent,#fff,#ffd27a,transparent);opacity:0;transform:rotate(-35deg) scaleX(0);pointer-events:none;box-shadow:0 0 14px #ffb24a}
#cine .slash.on{animation:slash .3s ease-out}
#cine .slash.on.r{background:linear-gradient(90deg,transparent,#fff,#ff6a6a,transparent);box-shadow:0 0 14px #f33;transform:rotate(35deg) scaleX(0);animation-name:slashr}
@keyframes slash{0%{opacity:1;transform:rotate(-35deg) scaleX(0)}50%{opacity:1;transform:rotate(-35deg) scaleX(1)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.2)}}
@keyframes slashr{0%{opacity:1;transform:rotate(35deg) scaleX(0)}50%{opacity:1;transform:rotate(35deg) scaleX(1)}100%{opacity:0;transform:rotate(35deg) scaleX(1.2)}}
#cine .dmg b.crit{font-size:28px;color:#ffe04a}
.shake{animation:shk .35s}

 h+='<div class="chs">';
 o.choices.forEach((c,i)=>{h+='<button class="btn '+(c.cls||'')+'" data-i="'+i+'"'+(c.dis?' disabled':'')+'>'+c.label+(c.tag?'<span class="tag">'+c.tag+'</span>':'')+'</button>'});

 m.innerHTML=h;m.classList.add('on');

 let cs=o.choices.filter(c=>!c.dis);
 let best=null;
 if(o.autoPick!=null)best=o.choices[o.autoPick];
 if(!best){const ad=cs.find(c=>c.isAd);if(ad)best=ad}
 if(!best){best=cs[0];let bp=-1;cs.forEach(c=>{const p=c.p==null?0.5:c.p;if(p>bp){bp=p;best=c}})}
 choose(best);
}

function parseCheck(ck,norm){

function applyFx(str,ctx){
 const chips=[];let die=null;
 if(!str)return {chips,die};
 str.trim().split(/\s+/).forEach(tk=>{

   return}
  if(tk==='comp-'){
   let n=ctx&&ctx.comp&&S.comps.includes(ctx.comp)?ctx.comp:S.comps[S.comps.length-1];
   if(n){S.comps.splice(S.comps.indexOf(n),1);S.fallen.push(n);chips.push(['n','失去伙伴：'+n])}
   return}
  if(m=tk.match(/^item:(\w+)/)){S.items[m[1]]=(S.items[m[1]]||0)+1;chips.push(['o',m[1]==='dan'?'获得：渡劫丹':'获得：替身草人']);return}

  if(tk==='leg')return;

  const k=m[1],sg=m[2]==='+'?1:-1,v=+m[3];
  if(k==='all'||AN[k]){
   const ks=k==='all'?AT:[k];
   let sum=0;
   ks.forEach(a=>{
    let d=sg>0?sround(v*sc(er())*GAINK*gmul(a)):-sround(v*sc(er())*GAINK*0.6);
    if(sg>0)d=Math.max(1,d);else d=Math.min(-1,d);
    S.a[a]=Math.max(1,S.a[a]+d);sum+=d;
    if(k!=='all')chips.push([d>0?'p':'n',AN[a]+(d>0?'+':'')+d]);
    markAttr(a,d);
   });
   if(k==='all')chips.push([sum>0?'p':'n','全属性'+(sum>0?'+':'')+Math.round(sum/6)]);
   return}
  if(k==='xp'){
   if(S.phase==='cult'){const old=S.xp;S.xp=Math.max(0,S.xp+sg*v);chips.push([sg>0?'p':'n','修为'+(sg>0?'+':'-')+Math.round(v*100)+'%'])}
   else{AT.forEach(a=>{S.a[a]+=sg*sround(v*sc(er())*GAINK*gmul(a));S.a[a]=Math.max(1,S.a[a])});chips.push([sg>0?'p':'n','全属性'+(sg>0?'+':'-')+Math.max(1,Math.round(v*sc(er())*GAINK))])}
   return}
  if(k==='age'){S.age+=sg*v;chips.push(['o',(sg>0?'过去了 ':'年轻了 ')+v+' 年']);return}
  if(k==='life'){const d=Math.round(v*(1+S.r*.3));S.lifeB+=sg*d;if(S.phase==='r2')S.r2life+=sg*d;chips.push([sg>0?'p':'n','寿元'+(sg>0?'+':'-')+d]);return}
  if(k==='kill'){S.kills+=v;if(talF('eater')){const d=Math.max(1,sround(GAINK*sc(er())*Math.min(5,Math.log2(1+v))));S.a.str+=d;chips.push(['p','吞噬：力量+'+d])}chips.push(['o','杀敌+'+fmt(v)]);return}
  if(k==='bk'){S.bk=clamp(S.bk+sg*v,0,40);chips.push([sg>0?'p':'n','渡劫把握'+(sg>0?'+':'-')+v+'%']);return}
  if(k==='ls'){const n=Math.max(1,Math.round(v*(typeof lu==='function'?lu():10)*(typeof lsK==='function'?lsK():1)));if(sg>0){lsAdd(n,'奇遇');chips.push(['p','灵石 +'+cpFmt(n)])}else if(lsPay(n,'奇遇',true)){chips.push(['n','灵石 -'+cpFmt(n)])}else{chips.push(['n','灵石不够扣'])};return}
  if(k==='fac'){if(!S.fac)return;S.fac.min=Math.max(50,Math.round(S.fac.min*(1+sg*v/100)));chips.push([sg>0?'p':'n','麾下'+(sg>0?'+':'-')+v+'%']);return}
  if(k==='land'){S.fac.land+=v;return}
 });
 return {chips,die};
}

function wheelPick(){let x=rnd()*100,a=0;for(let i=0;i<WSEG.length;i++){const w=WSEG[i][1];if(x<w)return {i,m:WSEG[i][0],th:(a+x)*3.6};x-=w;a+=w}return {i:0,m:1,th:1}}
function segStart(i){let a=0;for(let k=0;k<i;k++)a+=WSEG[k][1];return a*3.6}
function wheelRoll(){const r=wheelPick();r.near=false;
 const j=WSEG.findIndex(s=>s[0]===100);
 if(r.m===1&&r.i===j+1&&rnd()<.9){r.th=segStart(j+1)+.4+rnd()*1.4;r.near=true}
 else if(r.m===1&&rnd()<.35){r.th=segStart(j+1)+.4+rnd()*1.4;r.near=true}
 else if(r.m===10&&rnd()<.5){r.th=segStart(j)-.4-rnd()*1.2;r.near=true}
 STATS.wheel=STATS.wheel||{};STATS.wheel[r.m]=(STATS.wheel[r.m]||0)+1;return r}

 let a=-Math.PI/2;
 WSEG.forEach(([m,w])=>{const sw=w/100*Math.PI*2;
  g.beginPath();g.moveTo(0,0);g.arc(0,0,R-9,a,a+sw);g.closePath();
  if(m===100){const gr=g.createRadialGradient(0,0,20,0,0,R);gr.addColorStop(0,'#fff6c8');gr.addColorStop(1,'#ffb300');g.fillStyle=gr}else g.fillStyle=WCOL[m];
  g.fill();g.strokeStyle='#120a06';g.lineWidth=1.2;g.stroke();
  if(m===100){g.save();g.shadowColor='#ffe066';g.shadowBlur=14;g.strokeStyle='#fff3a0';g.lineWidth=2;g.stroke();g.restore()}
  g.save();g.rotate(a+sw/2);g.textAlign='right';g.textBaseline='middle';
  if(m===100){g.fillStyle='#ffe066';g.font='900 10px sans-serif';g.shadowColor='#ffb300';g.shadowBlur=6;g.fillText('★100',R-14,0)}
  else{g.fillStyle=m>=10?'#ffd0ff':m>=5?'#cfe4ff':'#fff1d0';g.font='800 '+(m>=10?21:19)+'px sans-serif';g.fillText('×'+m,R-20,0)}
  g.restore();a+=sw});
 g.beginPath();g.arc(0,0,R-5,0,Math.PI*2);g.lineWidth=9;g.strokeStyle='#b8862e';g.stroke();
 for(let i=0;i<24;i++){const t=i/24*Math.PI*2;g.beginPath();g.arc(Math.cos(t)*(R-5),Math.sin(t)*(R-5),2.6,0,7);g.fillStyle=i%2?'#fff6c8':'#ff9a1a';g.fill()}

}

 const ep=G[0].slice();const out=[];for(let i=0;i<=t;i++){out.push(ep.splice(Math.floor(r()*ep.length),1)[0])}
 return out.join('')+G[1][Math.floor(r()*G[1].length)]+GTR[t][Math.floor(r()*GTR[t].length)];

 encounter:(r,type)=>{const E=mkEnemy();if(r){E.ratio=r;E.cp=Math.max(1,Math.round(cp()*r));const ti=r<.55?0:r<.9?1:r<1.5?2:r<3?3:4;E.ti=ti;}if(type){const T=ETYPES.find(t=>t.id===type);E.T=T;E.art=T.art.length>1?T.art[Math.min(T.art.length-1,E.ti)]:T.art[0];E.say=pick(T.say);if(!E.who&&T.id!=='seng'&&T.id!=='beast'&&T.id!=='yao')E.who=ESUR[ri(0,ESUR.length-1)]+pick(EGIV)}E.title=E.T.t[E.ti];encounter(E)},
 cpBig:(a,b,t)=>cpBig(a,b,t||'破 境'),cp:()=>cp(),
 get S(){return S},get M(){return M},STATS,EVENTS,WARS,R1EV,R2EV,
 setStance(n){AUTOSTANCE=n},wcDeath,wcLuck,fbDrop,setAuto(on,norender,route){AUTO=on;NORENDER=!!norender;if(route)ROUTE=route;clearInterval(tickT)},

 setEff(t){if(!S)return;const f=t/effTot();AT.forEach(k=>S.a[k]=Math.ceil(S.a[k]*f));render()},
 setTot(t){if(!S)return;const f=t/tot();AT.forEach(k=>S.a[k]=Math.ceil(S.a[k]*f));render()},
 debug:(k)=>DBG[k]&&DBG[k](),
 lsAdd,lsPay,lsN,jobStart,bestJob,hubOpen,zyShow,zySpin,zyEval,zyGrid,nameModal,palRename,palQ,sellAll,mktGet,shopBuy,lu,btCost,subCost,G7,ZY,setBuyAds(b){BUYADS=b},
 saveMeta,saveRun,persistNow,exportSave,importSave,exportModal,importModal,ISFILE,

 '重修':()=>{if(S.phase==='cult'){S.phase='r2';S.r=8;S.r2life=S.age+3000}ascStart()},
 '天界之巅':()=>{S.asc=1;ascPeak()},
 '战力榜':()=>rankModal(),'攻略':()=>guideOpen(),

};

}
